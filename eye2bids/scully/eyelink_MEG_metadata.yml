---
# Scully Center OPM-MEG lab: EyeLink 1000 Plus eye-tracker metadata for eye2bids.
# Bundled with the Scully eye2bids install and used unless --metadata_file is
# given. TaskName comes from --task. Any value can be overridden with its flag;
# run `eye2bids -h` to see them.
#
# Fields follow BIDS 1.11 (eye-tracking, BEP 020):
# https://bids-specification.readthedocs.io/en/stable/modality-specific-files/physiological-recordings.html
# Distances and sizes are in meters.
#
# Read from each EDF by eye2bids (not set here): SamplingFrequency, RecordedEye,
# CalibrationType, CalibrationCount, Average/MaximalCalibrationError,
# PupilFitMethod, EyeTrackingMethod, ScreenResolution, DeviceSerialNumber.
#
# Setup (no BIDS field; kept here for reference):
#   Mount: OPM. Tracking mode: Remote, target sticker, monocular.
#   Lens: 16 mm. Camera-to-screen distance: 0.429 m.
#   Pupil detection: ellipse. Calibration: HV13.

# ---------------- REQUIRED ----------------
# EyeLink GAZE samples are in display pixels, origin at the top-left of the screen.
SampleCoordinateSystem: gaze-on-screen
ScreenOrigin: [top, left]
Units: pixel

# ---------------- RECOMMENDED / OPTIONAL ----------------
# EyeLink Host PC software version (from the EDF header).
SoftwareVersion: "5.51.53237"

ScreenRefreshRate: 120
ScreenSize: [0.606, 0.341]
# Perpendicular eye-to-screen distance, derived from eye-to-top 940 mm and
# eye-to-bottom 990 mm (eye ~0.14 m above screen center; eye-to-center ~0.95 m).
ScreenDistance: 0.94
# Target-sticker-to-camera distance reported by the EyeLink Host PC
# (varies slightly per participant).
EyeTrackerDistance: 0.61

RawDataFilters: "EyeLink heuristic file sample filter: EXTRA (level 2)"

InstitutionName: Princeton University, Princeton Neuroscience Institute
InstitutionAddress: 40 Woodlands Way, Princeton, NJ 08540, USA
